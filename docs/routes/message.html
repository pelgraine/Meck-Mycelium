<route-settings
    title="Message"
    backbutton="true"
    navbar="false"
    titlebar="true"
></route-settings>

<style>
    .chat-container {
        display: flex;
        flex-direction: column;
        height: 100%;
    }

    .message-list {
        flex: 1;
        overflow-y: auto;
        display: flex;
        flex-direction: column-reverse;
    }

    .message-timestamp {
        flex: 0 1 auto;
        white-space: nowrap;
        color: rgb(var(--mdui-color-on-surface-variant));
        font-size: var(--mdui-typescale-body-small-size);
        font-weight: var(--mdui-typescale-body-medium-weight);
        letter-spacing: var(--mdui-typescale-body-medium-tracking);
        line-height: var(--mdui-typescale-body-medium-line-height);
    }

    .message-content {
        color: rgb(var(--mdui-color-on-surface-variant));
    }
    
    .input-bar {
        bottom: 0;
        background: var(--mdui-color-background);
        padding: 0.5rem;
    }
    
    .message-content {
        white-space: pre-wrap;
        word-wrap: break-word;
        overflow-wrap: anywhere;
        font-size: var(--mdui-typescale-body-large-size);
    }
    
    .message {
        padding-top: 0.25rem;
        padding-bottom: 0.25rem;
        margin-top: 0.5rem;
        margin-bottom: 0.5rem;

        display: flex;
        align-items: flex-start;
        flex-wrap: wrap; 
    }
    
    .contact-name {
        font-size: large;
        font-weight: 500;
        color: rgb(var(--mdui-color-on-surface));
    }

    /* Voice messages */
    .input-row {
        display: flex;
        align-items: flex-start;
        gap: 0.25rem;
    }

    .input-row mdui-text-field {
        flex: 1;
    }

    .voice-bar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0.25rem 0.5rem 0.5rem;
    }

    .voice-status {
        flex: 1;
        min-width: 8rem;
        color: rgb(var(--mdui-color-on-surface-variant));
        font-size: var(--mdui-typescale-body-medium-size);
    }

    .voice-level {
        flex-basis: 100%;
        height: 6px;
        border-radius: 3px;
        background: rgb(var(--mdui-color-surface-variant));
        overflow: hidden;
    }

    .voice-level-fill {
        height: 100%;
        width: 0;
        background: rgb(var(--mdui-color-primary));
    }

    .voice-message {
        cursor: pointer;
        color: rgb(var(--mdui-color-primary));
        font-weight: 500;
    }
</style>

<template id="messageTemplate">
    <mdui-list-item alignment="start" class="message">
        <mdui-avatar id="contactAvatar" slot="icon"></mdui-avatar>
        <span id="contactName" class="contact-name"></span>
        <span style="margin-left: 0.25rem;"></span>
        <time-stamp id="messageTimeStamp" class="message-timestamp" type="datetime"></time-stamp>
        <span id="messageContent" class="message-content" slot="description"></span>
    </mdui-list-item>
</template>

<div class="chat-container">
    <div class="message-list">
        <mdui-list id="messageList" class="hidden"></mdui-list>
    </div>

    <div id="emptyMessage" class="pageNotice">
        <span>No messages</span>
        <span>Remeber both of you have to be added as a contact.</span>
    </div>

    <div class="input-bar">
        <div id="voiceBar" class="voice-bar hidden">
            <span id="voiceStatus" class="voice-status"></span>
            <mdui-button id="voicePlayButton" variant="tonal" icon="play_arrow" class="hidden">Play</mdui-button>
            <mdui-button id="voiceSendButton" variant="filled" icon="send" class="hidden">Send</mdui-button>
            <mdui-button id="voiceDiscardButton" variant="text" icon="delete" class="hidden">Discard</mdui-button>
            <div id="voiceLevel" class="voice-level hidden"><div id="voiceLevelFill" class="voice-level-fill"></div></div>
        </div>
        <div class="input-row">
            <mdui-text-field
                id="messageTextFeild"
                autosize
                placeholder="Direct message..."
                maxlength="128"
                counter variant="outlined"
                radio-only
            >
                <mdui-button-icon disabled slot="icon" icon="add"></mdui-button-icon>
                <mdui-button-icon id="sendButton" slot="end-icon" icon="send"></mdui-button-icon>
            </mdui-text-field>
            <mdui-button-icon id="micButton" icon="mic" variant="tonal" title="Record a voice message"></mdui-button-icon>
        </div>
    </div>
</div>
